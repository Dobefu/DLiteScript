version: "2"
linters:
  enable:
    - asciicheck
    - bodyclose
    - canonicalheader
    - copyloopvar
    - dupword
    - errcheck
    - errname
    - exhaustive
    - exhaustruct
    - exptostd
    - forbidigo
    - gocognit
    - gocritic
    - godot
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize
    - nlreturn
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - revive
    - tagliatelle
    - sloglint
    - staticcheck
    - unconvert
    - unqueryvet
    - unused
    - wrapcheck
  settings:
    gocognit:
      min-complexity: 15
    perfsprint:
      strconcat: false
    revive:
      rules:
        - name: var-naming
          disabled: true
